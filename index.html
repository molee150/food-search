<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环球美食查询 · 一键找到你想要的菜</title>
<style>
  :root{
    --bg:#faf6f1;
    --bg2:#f3ece2;
    --ink:#2b2320;
    --ink-soft:#7a6f66;
    --accent:#e8562a;
    --accent2:#f59e0b;
    --card:#ffffff;
    --line:#eadfd3;
    --shadow:0 10px 30px rgba(90,60,30,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, #ffe8d6 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 10%, #fde8e8 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,.78);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-size:20px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  .logo .dot{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px rgba(232,86,42,.35);
  }
  .nav .count{font-size:13px;color:var(--ink-soft)}

  /* ---------- hero ---------- */
  .hero{text-align:center;padding:52px 0 28px}
  .hero h1{
    font-size:clamp(28px,5vw,46px);font-weight:900;letter-spacing:1px;
    background:linear-gradient(90deg,#e8562a,#f59e0b,#e8562a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin-top:12px;color:var(--ink-soft);font-size:16px}

  /* ---------- search ---------- */
  .searchbar{display:flex;gap:10px;max-width:640px;margin:0 auto}
  .searchbar .box{
    flex:1;display:flex;align-items:center;gap:10px;
    background:#fff;border:1.5px solid var(--line);border-radius:999px;
    padding:0 18px;height:54px;box-shadow:var(--shadow);transition:.2s;
  }
  .searchbar .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,86,42,.12)}
  .searchbar .box svg{flex:none;opacity:.5}
  .searchbar input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:var(--ink)}
  .searchbar .clear{display:none;border:none;background:#eee;color:#777;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:999px;
    transition:.18s;white-space:nowrap;
  }
  .btn-primary{background:linear-gradient(135deg,var(--accent),#f0622f);color:#fff;padding:0 24px;font-size:15px;box-shadow:0 8px 20px rgba(232,86,42,.35)}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);padding:0 18px;font-size:15px}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- filters ---------- */
  .filters{margin-top:26px;display:flex;flex-direction:column;gap:16px}
  .fgroup{display:flex;align-items:flex-start;gap:12px}
  .fgroup .label{
    flex:none;font-size:14px;font-weight:800;color:var(--ink-soft);
    padding-top:7px;width:44px;text-align:right;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:6px 14px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;font-weight:700;box-shadow:0 4px 12px rgba(232,86,42,.3)}
  .chip .flag{font-size:16px}

  .resultbar{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
  .resultbar .info{font-size:14px;color:var(--ink-soft)}
  .resultbar .info b{color:var(--accent)}
  .btn-reset{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:13px;text-decoration:underline}
  .btn-reset:hover{color:var(--accent)}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px;padding-bottom:60px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(90,60,30,.05);
    transition:transform .2s, box-shadow .2s;display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
  .card .thumb{
    height:150px;display:grid;place-items:center;font-size:64px;position:relative;
    background:linear-gradient(135deg,#fff6ec,#ffe9d6);
  }
  .card .thumb .country{
    position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);color:#6b5b4e;
    font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .card .body{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card .name{font-size:18px;font-weight:800}
  .card .nameEn{font-size:12px;color:var(--ink-soft);margin-top:-6px}
  .card .meta{display:flex;gap:8px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
  .card .meta span{background:var(--bg2);padding:2px 9px;border-radius:6px}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap}
  .taste{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
  .card .desc{font-size:13px;color:var(--ink-soft);flex:1}
  .card .more{font-size:13px;color:var(--accent);font-weight:700;margin-top:auto}

  /* ---------- empty ---------- */
  .empty{display:none;text-align:center;padding:70px 20px;color:var(--ink-soft)}
  .empty .emoji{font-size:60px;margin-bottom:14px}
  .empty h3{font-size:20px;color:var(--ink);margin-bottom:6px}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(40,25,15,.5);backdrop-filter:blur(4px);
    display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;
  }
  .overlay.show{display:flex}
  .modal{
    background:#fff;border-radius:22px;max-width:640px;width:100%;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .25s ease;
  }
  @keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .modal .m-thumb{height:200px;display:grid;place-items:center;font-size:90px;position:relative;background:linear-gradient(135deg,#fff6ec,#ffe9d6)}
  .modal .close{
    position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(255,255,255,.9);font-size:20px;cursor:pointer;color:#555;box-shadow:0 4px 12px rgba(0,0,0,.12);
  }
  .modal .m-body{padding:26px}
  .modal h2{font-size:26px;font-weight:900}
  .modal .m-sub{color:var(--ink-soft);font-size:14px;margin-top:2px}
  .modal .m-tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .modal .m-desc{color:#5c4f45;font-size:15px;margin-bottom:20px}
  .modal .m-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .modal .m-meta span{background:var(--bg2);padding:6px 14px;border-radius:8px;font-size:14px;font-weight:700}
  .modal h4{font-size:16px;font-weight:800;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
  .modal h4::before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent2))}
  .modal ul.ing{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal ul.ing li{background:#faf5ee;padding:8px 12px;border-radius:8px;font-size:14px}
  .modal ol.steps{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:10px}
  .modal ol.steps li{position:relative;padding-left:42px;font-size:14.5px}
  .modal ol.steps li::before{
    counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;
    width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px;
  }
  .modal .m-tip{background:#fff8e6;border-left:4px solid var(--accent2);padding:12px 16px;border-radius:10px;font-size:14px;margin-top:18px;color:#7a5b1e}
  @media(max-width:560px){.modal ul.ing{grid-template-columns:1fr}}

  footer{text-align:center;padding:30px 20px;color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="logo"><span class="dot">🍜</span>环球美食查询</div>
    <div class="count" id="totalCount"></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>今天想吃点什么？</h1>
    <p>按国家、口味（酸甜苦辣）快速找到全球美食，附详细做法菜谱</p>
  </section>

  <section class="searchbar">
    <div class="box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="搜索菜名、食材、国家… 如「豆腐」「泰国」「鸡蛋」">
      <button class="clear" id="clearBtn" title="清空">×</button>
    </div>
    <button class="btn btn-ghost" id="randomBtn" title="随机推荐一道">🎲 随机</button>
  </section>

  <section class="filters">
    <div class="fgroup">
      <div class="label">国家</div>
      <div class="chips" id="countryChips"></div>
    </div>
    <div class="fgroup">
      <div class="label">口味</div>
      <div class="chips" id="tasteChips"></div>
    </div>
    <div class="fgroup">
      <div class="label">类型</div>
      <div class="chips" id="catChips"></div>
    </div>
  </section>

  <div class="resultbar">
    <div class="info" id="resultInfo"></div>
    <button class="btn-reset" id="resetBtn">清空全部筛选</button>
  </div>

  <section class="grid" id="grid"></section>
  <div class="empty" id="empty">
    <div class="emoji">🔍</div>
    <h3>没有找到匹配的美食</h3>
    <p>换个关键词，或点击上方「清空全部筛选」试试</p>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<footer>环球美食查询 · 数据仅供家常参考，口味与做法可随个人喜好调整</footer>

<script>
const DISHES = [
  // ============ 中国 ============
  {name:"麻婆豆腐",nameEn:"Mapo Tofu",country:"中国",emoji:"🌶️",tastes:["辣","咸","鲜"],category:"主菜",difficulty:"简单",time:"20分钟",
   desc:"川菜经典，豆腐嫩滑、麻辣鲜香，一勺浇在米饭上最下饭。",
   ing:["嫩豆腐 1 盒","猪肉末 80g","郫县豆瓣酱 2 勺","花椒粉 1 小勺","蒜末、姜末 适量","葱花 适量"],
   steps:["豆腐切小块，入淡盐水焯 1 分钟捞出备用。","热油下肉末炒散至变色，加豆瓣酱、蒜末姜末炒出红油。","加小半碗水烧开，轻轻放入豆腐，小火煮 3 分钟。","淋入水淀粉勾芡至汤汁浓稠，撒花椒粉与葱花即可。"],
   tip:"豆腐用盐水焯过不易碎；喜欢更麻可出锅后额外撒一层花椒粉。"},
  {name:"糖醋里脊",nameEn:"Sweet & Sour Pork",country:"中国",emoji:"🍖",tastes:["酸","甜"],category:"主菜",difficulty:"中等",time:"30分钟",
   desc:"外酥里嫩、酸甜开胃，孩子最爱的一道经典家常菜。",
   ing:["猪里脊 300g","鸡蛋 1 个","淀粉、面粉 各 2 勺","番茄酱 3 勺","白醋 2 勺","白糖 2 勺"],
   steps:["里脊切条，加盐、料酒、蛋液抓匀，裹上淀粉面粉混合粉。","油温六成热下锅，中小火炸至金黄捞出，再复炸一次更酥脆。","锅留底油，下番茄酱、白醋、白糖和少许水炒成浓稠糖醋汁。","倒入炸好的里脊快速翻匀，撒白芝麻出锅。"],
   tip:"糖醋汁按「1 糖 : 1 醋 : 1.5 番茄酱」大致比例调，酸甜更平衡。"},
  {name:"宫保鸡丁",nameEn:"Kung Pao Chicken",country:"中国",emoji:"🍗",tastes:["辣","咸"],category:"主菜",difficulty:"简单",time:"25分钟",
   desc:"鸡丁滑嫩、花生香脆，咸鲜微辣带一丝回甜。",
   ing:["鸡腿肉 300g","炸花生米 60g","干辣椒 8 个","花椒 1 小勺","葱段 适量","生抽、醋、糖 适量"],
   steps:["鸡腿肉切丁，加料酒、生抽、淀粉抓匀腌 10 分钟。","调汁：生抽、醋、糖、少许淀粉和水拌匀备用。","热油下干辣椒和花椒爆香，下鸡丁大火滑炒至变色。","倒入料汁翻炒收浓，加葱段和花生米翻匀出锅。"],
   tip:"花生米最后放，保持香脆不回软。"},
  {name:"红烧肉",nameEn:"Braised Pork Belly",country:"中国",emoji:"🥘",tastes:["咸","甜"],category:"主菜",difficulty:"中等",time:"90分钟",
   desc:"肥而不腻、入口即化，酱香浓郁的红烧肉是团圆饭的常客。",
   ing:["五花肉 500g","冰糖 30g","生抽 3 勺","老抽 1 勺","料酒 2 勺","姜片、八角、桂皮 适量"],
   steps:["五花肉切块，冷水下锅加料酒焯水，捞出沥干。","锅放少量油下冰糖，小火炒出焦糖色。","下肉块翻炒上色，加姜片、八角、桂皮、生抽、老抽。","加热水没过肉，小火炖 60 分钟，大火收汁至浓稠。"],
   tip:"炒糖色用小火，颜色变琥珀色即可下肉，避免发苦。"},
  {name:"苦瓜炒蛋",nameEn:"Bitter Melon with Egg",country:"中国",emoji:"🥒",tastes:["苦","咸"],category:"主菜",difficulty:"简单",time:"15分钟",
   desc:"苦瓜清爽解腻、鸡蛋滑嫩，微苦回甘，清热又下饭。",
   ing:["苦瓜 1 根","鸡蛋 3 个","蒜末 适量","盐、糖 适量"],
   steps:["苦瓜对半剖开去瓤，切薄片，加盐腌 10 分钟挤去苦水。","鸡蛋打散，热油炒至凝固盛出。","另起锅爆香蒜末，下苦瓜大火翻炒 2 分钟。","倒入鸡蛋，加盐和少许糖翻匀即可。"],
   tip:"去瓤后把白色内膜刮干净，苦味会轻很多。"},
  {name:"酸辣汤",nameEn:"Hot & Sour Soup",country:"中国",emoji:"🥣",tastes:["酸","辣"],category:"汤羹",difficulty:"简单",time:"20分钟",
   desc:"酸辣开胃、料足暖身，一碗下肚整个人都通透了。",
   ing:["嫩豆腐 半盒","木耳、香菇 适量","鸡蛋 1 个","白胡椒粉 1 勺","陈醋 2 勺","水淀粉 适量"],
   steps:["豆腐、木耳、香菇切丝，鸡蛋打散。","锅中加水烧开，下豆腐丝、木耳、香菇煮 3 分钟。","加盐、白胡椒粉、生抽调味，淋入陈醋。","倒入水淀粉勾芡，再淋入蛋液搅成蛋花，撒香菜出锅。"],
   tip:"白胡椒粉要足量，是酸辣汤「辣」的灵魂。"},
  {name:"小笼包",nameEn:"Soup Dumplings",country:"中国",emoji:"🥟",tastes:["咸","鲜"],category:"小吃",difficulty:"难",time:"120分钟",
   desc:"皮薄馅大、汤汁满满，轻轻一咬鲜美的肉汁就流出来。",
   ing:["面粉 300g","猪皮冻 150g","猪肉末 300g","姜末、葱花 适量","生抽、香油 适量"],
   steps:["面粉加温水揉成光滑面团，醒发 30 分钟。","肉末加姜末、生抽、香油、盐和切碎的皮冻拌匀成馅。","面团擀成中间厚边缘薄的皮，包入馅料收口。","上蒸锅大火蒸 8 分钟，蘸姜丝醋吃。"],
   tip:"皮冻是汤汁的来源，提前熬好冷藏凝结后切碎拌馅。"},
  {name:"蛋炒饭",nameEn:"Egg Fried Rice",country:"中国",emoji:"🍚",tastes:["咸","鲜"],category:"主食",difficulty:"简单",time:"10分钟",
   desc:"粒粒分明、蛋香四溢，隔夜饭的黄金归宿。",
   ing:["隔夜米饭 2 碗","鸡蛋 2 个","葱花 适量","火腿丁 适量","盐、生抽 适量"],
   steps:["鸡蛋打散，热油下锅快速炒成碎蛋盛出。","锅里补点油，下米饭大火炒散、炒到粒粒分明。","加火腿丁、炒蛋，淋少许生抽和盐翻炒。","最后撒大量葱花，翻匀出锅。"],
   tip:"米饭提前拨散再下锅，全程大火，才能粒粒分明。"},
  // ============ 日本 ============
  {name:"寿司",nameEn:"Sushi",country:"日本",emoji:"🍣",tastes:["鲜"],category:"主食",difficulty:"中等",time:"40分钟",
   desc:"醋饭清甜、鱼生鲜美，一口一个的经典日式料理。",
   ing:["寿司米 2 杯","寿司醋 3 勺","三文鱼、金枪鱼 适量","海苔 2 张","芥末、酱油 适量"],
   steps:["米煮熟趁热拌入寿司醋，用扇子扇凉成醋饭。","鱼肉切片备用。","手上沾水，取适量醋饭握成椭圆饭团。","抹少许芥末，盖上鱼片捏合，配酱油食用。"],
   tip:"握寿司手要保持湿润，米饭才不会粘手。"},
  {name:"天妇罗",nameEn:"Tempura",country:"日本",emoji:"🍤",tastes:["咸","鲜"],category:"小吃",difficulty:"中等",time:"30分钟",
   desc:"面衣轻薄酥脆，蔬菜与鲜虾的鲜甜被完美锁住。",
   ing:["大虾 8 只","茄子、南瓜 适量","低筋面粉 100g","冰水 150ml","鸡蛋 1 个","日式酱油、萝卜泥 适量"],

const TASTE_COLORS = {
  "酸":{bg:"#e6f4ea",fg:"#1e8e3e",icon:"🍋"},
  "甜":{bg:"#fde7f0",fg:"#c2185b",icon:"🍬"},
  "苦":{bg:"#f3ece4",fg:"#6d4c2f",icon:"☕"},
  "辣":{bg:"#fdecea",fg:"#d93025",icon:"🌶️"},
  "咸":{bg:"#e8f0fe",fg:"#1a73e8",icon:"🧂"},
  "鲜":{bg:"#fef3e0",fg:"#e8710a",icon:"🦐"}
};

const CAT_ICONS = {主菜:"🍽️",主食:"🍚",小吃:"🥟",甜品:"🍰",汤羹:"🥣",沙拉:"🥗",饮品:"🍹"};

const countries = [...new Set(DISHES.map(d=>d.country))];
const tastes = Object.keys(TASTE_COLORS);
const cats = [...new Set(DISHES.map(d=>d.category))];

const state = {search:"", countries:new Set(), tastes:new Set(), cats:new Set()};

const $ = id => document.getElementById(id);
const grid = $("grid"), empty = $("empty");

function tasteBadge(t){
  const c = TASTE_COLORS[t] || {bg:"#eee",fg:"#555",icon:""};
  return `<span class="taste" style="background:${c.bg};color:${c.fg}">${c.icon} ${t}</span>`;
}

function buildChips(){
  $("countryChips").innerHTML = countries.map(c =>
    `<button class="chip" data-c="${c}">${c}</button>`).join("");
  $("tasteChips").innerHTML = tastes.map(t =>
    `<button class="chip" data-t="${t}">${TASTE_COLORS[t].icon} ${t}</button>`).join("");
  $("catChips").innerHTML = cats.map(c =>
    `<button class="chip" data-cat="${c}">${CAT_ICONS[c]||""} ${c}</button>`).join("");
}

function matches(d){
  if(state.search){
    const q = state.search.toLowerCase();
    const hay = [d.name,d.nameEn,d.country,d.desc,d.ing.join(""),d.category].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(state.countries.size && !state.countries.has(d.country)) return false;
  if(state.tastes.size && !d.tastes.some(t=>state.tastes.has(t))) return false;
  if(state.cats.size && !state.cats.has(d.category)) return false;
  return true;
}

function render(){
  const list = DISHES.filter(matches);
  $("totalCount").textContent = `共收录 ${DISHES.length} 道美食`;
  $("resultInfo").innerHTML = `找到 <b>${list.length}</b> 道菜`;

  grid.innerHTML = list.map(d=>`
    <article class="card" onclick="openDish(${DISHES.indexOf(d)})">
      <div class="thumb"><span>${d.emoji}</span><span class="country">${d.country}</span></div>
      <div class="body">
        <div class="name">${d.name}</div>
        <div class="nameEn">${d.nameEn}</div>
        <div class="tags">${d.tastes.map(tasteBadge).join("")}</div>
        <div class="meta"><span>${CAT_ICONS[d.category]||""} ${d.category}</span><span>⏱ ${d.time}</span><span>🔥 ${d.difficulty}</span></div>
        <div class="desc">${d.desc}</div>
        <div class="more">查看做法 →</div>
      </div>
    </article>`).join("");

  empty.style.display = list.length ? "none" : "block";
  syncChips();
}

function syncChips(){
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.classList.toggle("on",
      (ch.dataset.c && state.countries.has(ch.dataset.c)) ||
      (ch.dataset.t && state.tastes.has(ch.dataset.t)) ||
      (ch.dataset.cat && state.cats.has(ch.dataset.cat)));
  });
  $("clearBtn").style.display = state.search ? "block" : "none";
}

function openDish(idx){
  const d = DISHES[idx];
  $("modal").innerHTML = `
    <div class="m-thumb"><span>${d.emoji}</span><button class="close" onclick="closeDish()">×</button></div>
    <div class="m-body">
      <h2>${d.name}</h2>
      <div class="m-sub">${d.nameEn} · ${d.country}</div>
      <div class="m-tags">${d.tastes.map(tasteBadge).join("")}
        <span class="taste" style="background:#f1ede8;color:#7a6f66">${CAT_ICONS[d.category]||""} ${d.category}</span>
      </div>
      <p class="m-desc">${d.desc}</p>
      <div class="m-meta"><span>⏱ ${d.time}</span><span>🔥 难度：${d.difficulty}</span></div>
      <h4>所需食材</h4>
      <ul class="ing">${d.ing.map(i=>`<li>${i}</li>`).join("")}</ul>
      <h4>做法步骤</h4>
      <ol class="steps">${d.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="m-tip">💡 ${d.tip}</div>
    </div>`;
  $("overlay").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeDish(){
  $("overlay").classList.remove("show");
  document.body.style.overflow = "";
}

$("overlay").addEventListener("click",e=>{ if(e.target===$("overlay")) closeDish(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDish(); });

$("search").addEventListener("input",e=>{ state.search = e.target.value.trim(); render(); });
$("clearBtn").addEventListener("click",()=>{ $("search").value=""; state.search=""; render(); });

function bindChip(id, set, key){
  $(id).addEventListener("click",e=>{
    const ch = e.target.closest(".chip"); if(!ch) return;
    const v = ch.dataset[key];
    set.has(v) ? set.delete(v) : set.add(v);
    render();
  });
}
bindChip("countryChips", state.countries, "c");
bindChip("tasteChips", state.tastes, "t");
bindChip("catChips", state.cats, "cat");

$("resetBtn").addEventListener("click",()=>{
  state.search=""; state.countries.clear(); state.tastes.clear(); state.cats.clear();
  $("search").value="";
  render();
});

$("randomBtn").addEventListener("click",()=>{
  const list = DISHES.filter(matches);
  if(!list.length) return;
  openDish(DISHES.indexOf(list[Math.floor(Math.random()*list.length)]));
});

buildChips();
render();
</script>
</body>
</html>
